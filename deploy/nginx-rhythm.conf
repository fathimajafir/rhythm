# nginx reverse proxy for Rhythm: TLS termination + gateway load-balancing.
# The API and MCP gateways bind 127.0.0.1 only; nginx is the only public face.

limit_req_zone $binary_remote_addr zone=rhythm_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rhythm_mcp:10m rate=30r/s;

upstream rhythm_api {
    server 127.0.0.1:8099;
    keepalive 16;
}

# Add/remove gateway ports here as systemd instances start/stop:
#   rhythm-mcp@8090 rhythm-mcp@8091 rhythm-mcp@8092
upstream rhythm_mcp {
    least_conn;
    server 127.0.0.1:8090;
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rhythm.example.com;

    ssl_certificate     /etc/ssl/rhythm/fullchain.pem;
    ssl_certificate_key /etc/ssl/rhythm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logs
    access_log /var/log/nginx/rhythm.access.log;
    error_log  /var/log/nginx/rhythm.error.log warn;

    # ---- API (mobile/web clients) ----
    location / {
        limit_req zone=rhythm_api burst=20 nodelay;
        proxy_pass http://rhythm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- MCP (agent hosts / MCP clients) ----
    # Streamable HTTP needs both POST (JSON) and GET (SSE) on /mcp.
    location /mcp {
        limit_req zone=rhythm_mcp burst=60 nodelay;
        proxy_pass http://rhythm_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE must stream
        proxy_read_timeout 300s;      # long-lived sessions
        chunked_transfer_encoding on;
    }

    # Manifest is public by design (anti-shadowing digest for clients to pin).
    location /.well-known/rhythm-manifest.json {
        proxy_pass http://rhythm_mcp;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name rhythm.example.com;
    return 301 https://$host$request_uri;
}
